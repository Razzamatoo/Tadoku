<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tadoku">
<meta name="theme-color" content="#EEF1F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131822" media="(prefers-color-scheme: dark)">
<title>Tadoku</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F3; --sheet:#F8FAFB; --ink:#1B2233; --muted:#5F6878; --rule:#D3D9E0;
  --ai:#2C4A7A; --ai-soft:#DCE4F1; --beni:#B8285F; --beni-soft:#F6DDE7; --on-ai:#F8FAFB;
  --jp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131822; --sheet:#1A202C; --ink:#E5E8ED; --muted:#9AA2B0; --rule:#2B3342;
    --ai:#8FA9DA; --ai-soft:#24314A; --beni:#F07FA9; --beni-soft:#3A2230; --on-ai:#131822;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131822; --sheet:#1A202C; --ink:#E5E8ED; --muted:#9AA2B0; --rule:#2B3342;
  --ai:#8FA9DA; --ai-soft:#24314A; --beni:#F07FA9; --beni-soft:#3A2230; --on-ai:#131822;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:4px}
.wrap{max-width:40rem;margin:0 auto;padding:0 1.25rem}

header{padding:1.25rem 0 .75rem;border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:.75rem}
.brand{display:flex;align-items:baseline;gap:.5rem;margin-right:auto}
.brand b{font-family:var(--jp);font-weight:600;font-size:1.75rem;letter-spacing:.05em}
.brand span{color:var(--muted);font-size:.9rem}
.ghost{background:none;border:1px solid var(--rule);border-radius:10px;padding:.4rem .75rem;cursor:pointer}
.pool{margin:.4rem 0 0;font-size:.85rem;color:var(--muted);min-height:1.4em}
#ready{margin-top:0;color:var(--ai)}
#ready:empty{display:none}

main{padding:1.5rem 0 9rem}
main.dim{opacity:.35;pointer-events:none}
.notice{margin:1rem 0 0;padding:.9rem 1rem;border-radius:10px;font-size:.95rem}
.notice.status{background:var(--ai-soft);color:var(--ai)}
.notice.error{background:var(--beni-soft);color:var(--beni)}
.notice[hidden]{display:none}

/* Story */
.title{font-family:var(--jp);font-weight:600;font-size:1.6rem;line-height:2.2;margin:0 0 1rem}
.sent{margin:0 0 .35rem}
.s{font-family:var(--jp);font-size:1.3rem;line-height:2.5;margin:0}
.en{margin:-.2rem 0 .8rem;padding-left:.9rem;border-left:2px solid var(--rule);color:var(--muted);font-size:.95rem;line-height:1.5}
.en[hidden]{display:none}
ruby{ruby-align:center;ruby-position:over}
ruby rt{font-family:var(--ui);font-size:.5em;color:var(--muted);letter-spacing:0;ruby-align:center}
body.furi-tap .s ruby rt,body.furi-tap .title ruby rt{display:none}
body.furi-tap .s ruby.on rt,body.furi-tap .title ruby.on rt{display:ruby-text}
body.furi-tap .s ruby,body.furi-tap .title ruby{cursor:pointer}

.tg{cursor:pointer;border-radius:3px}
.tg.crit{color:var(--beni);-webkit-text-emphasis:filled sesame var(--beni);text-emphasis:filled sesame var(--beni);-webkit-text-emphasis-position:under;text-emphasis-position:under right}
.tg.rein{color:var(--ai);text-decoration:underline;text-decoration-color:var(--ai);text-decoration-thickness:2px;text-underline-offset:.35em}
.tg:active{background:var(--ai-soft)}
.bad{outline:1px dashed var(--muted);outline-offset:1px;border-radius:2px}

/* The translation stamp */
.yaku{display:inline-flex;align-items:center;justify-content:center;width:1.7rem;height:1.7rem;margin-left:.35rem;vertical-align:.2em;border:1.5px solid var(--beni);color:var(--beni);background:transparent;border-radius:50%;font-family:var(--jp);font-size:.85rem;line-height:1;cursor:pointer;padding:0}
.nb{white-space:nowrap}
.oto{display:inline-flex;align-items:center;justify-content:center;width:1.7rem;height:1.7rem;margin-left:.35rem;vertical-align:.2em;border:1.5px solid var(--ai);color:var(--ai);background:transparent;border-radius:50%;font-family:var(--jp);font-size:.85rem;line-height:1;cursor:pointer;padding:0}
.oto.on{background:var(--ai);color:var(--sheet)}
.sent.speaking .s{background:var(--ai-soft);border-radius:6px;box-shadow:0 0 0 .3rem var(--ai-soft)}
.listen{margin:0 0 1.25rem}
.s ruby,.title ruby{cursor:pointer}
.kl{list-style:none;margin:0 0 1rem;padding:0}
.kl li{display:flex;gap:.75rem;align-items:baseline;padding:.3rem 0;border-bottom:1px solid var(--rule);font-size:.9rem}
.kl li b{font-family:var(--jp);font-size:1.3rem;font-weight:400}
.kl li span{color:var(--muted)}
.lib{list-style:none;margin:0;padding:0}
.lib button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:.75rem 0;cursor:pointer}
.lib .lt{font-family:var(--jp);font-size:1.15rem;display:block}
.lib .ld{font-size:.8rem;color:var(--muted)}
.lib .cur .lt{color:var(--ai)}
.yaku[aria-expanded="true"]{background:var(--beni);color:var(--sheet)}

h2{font-size:1rem;font-weight:700;margin:2.5rem 0 .75rem;padding-top:1.25rem;border-top:1px solid var(--rule)}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.25rem;font-size:.85rem;color:var(--muted);margin:0 0 1.5rem}
.legend span[lang]{font-family:var(--jp);font-size:1rem;margin-right:.3rem}

details{margin:0 0 1rem}
details .q{font-family:var(--jp);font-size:1.15rem;line-height:2.3;margin:0}
summary{cursor:pointer;color:var(--ai);font-size:.9rem}
details p.a{margin:.3rem 0 0;color:var(--muted)}

.words{list-style:none;margin:0;padding:0}
.words li{border-bottom:1px solid var(--rule)}
.word{display:grid;grid-template-columns:auto 1fr;gap:.1rem 1rem;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:.7rem 0;cursor:pointer}
.word .c{grid-row:span 2;font-family:var(--jp);font-size:1.5rem;min-width:3.5rem}
.word.crit .c{color:var(--beni)}
.word.pick .c{color:var(--ai)}
.tg.pick{color:var(--ai);-webkit-text-emphasis:filled sesame var(--ai);text-emphasis:filled sesame var(--ai);-webkit-text-emphasis-position:under;text-emphasis-position:under right}
.linkbtn{background:none;border:0;padding:0;color:var(--ai);font-size:.85rem;text-decoration:underline;text-underline-offset:.2em;cursor:pointer;margin-top:.3rem}
#pick .sheet{padding-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.75rem 0}
.chips button{border:1px solid var(--rule);background:none;border-radius:999px;padding:.3rem .8rem;font-size:.85rem;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--on-ai)}
#pickSearch{width:100%;padding:.6rem .75rem;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.pl{list-style:none;margin:0;padding:0}
label.pk{display:grid;grid-template-columns:auto auto 1fr;gap:0 .8rem;align-items:center;margin:0;padding:.55rem 0;border-bottom:1px solid var(--rule);font-size:.9rem;cursor:pointer}
label.pk input{display:inline;width:1.2rem;height:1.2rem;margin:0;padding:0;accent-color:var(--ai)}
label.pk .c{font-family:var(--jp);font-size:1.35rem;min-width:3rem}
label.pk .x{display:block;font-size:.78rem;color:var(--muted)}
label.pk.off{opacity:.45}
.pickfoot{position:sticky;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);margin:0 -1.25rem;padding:.75rem 1.25rem calc(.75rem + env(safe-area-inset-bottom,0px));display:flex;gap:.5rem;align-items:center}
.pickfoot .n{margin-right:auto;font-size:.85rem;color:var(--muted)}
.picked{font-size:.85rem;color:var(--ai);margin-top:.3rem}
.word.rein .c{color:var(--ai)}
.word .m{font-size:.95rem}
.word .x{font-size:.8rem;color:var(--muted)}

/* Empty and setup */
.intro{font-family:var(--jp);font-size:1.35rem;line-height:1.9;margin:.5rem 0 1rem}
.steps{padding-left:1.25rem;color:var(--muted)}
.steps li{margin:.4rem 0}
a{color:var(--ai)}

/* Bottom bar */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);padding:.75rem 0 calc(.75rem + env(safe-area-inset-bottom,0px))}
.dock .wrap{display:flex;gap:.5rem}
.dock input{flex:1;min-width:0;padding:.7rem .85rem;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.primary{background:var(--ai);color:var(--on-ai);border:0;border-radius:10px;padding:.7rem 1.1rem;font-weight:700;cursor:pointer;white-space:nowrap}
.primary:disabled{opacity:.5;cursor:default}

/* Sheets */
dialog{border:0;padding:0;background:var(--sheet);color:var(--ink);width:min(40rem,100%);max-width:100%;max-height:88vh;margin:auto auto 0;border-radius:16px 16px 0 0}
dialog::backdrop{background:rgba(10,14,22,.45)}
.sheet{padding:1.25rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom,0px));overflow-y:auto;max-height:88vh}
.sheet h3{margin:0 0 1rem;font-size:1.1rem}
label{display:block;margin:0 0 .9rem;font-size:.9rem}
label small{display:block;color:var(--muted);font-size:.8rem}
label input,label select{display:block;width:100%;margin-top:.3rem;padding:.6rem .75rem;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 .75rem}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.25rem}
.danger{color:var(--beni);border-color:var(--beni)}
.ws-char{font-family:var(--jp);font-size:3rem;line-height:1.3}
.ws-read{font-family:var(--jp);font-size:1.2rem;color:var(--muted)}
.ws-mean{font-size:1.1rem;margin:.4rem 0 1rem}
dl{display:grid;grid-template-columns:auto 1fr;gap:.25rem 1rem;margin:0 0 1rem;font-size:.9rem}
dt{color:var(--muted)} dd{margin:0}
.why{font-size:.9rem;color:var(--muted);margin:0 0 1rem}
.draft{font-size:.85rem;color:var(--muted);margin:-.5rem 0 1rem}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="wrap">
  <div class="bar">
    <div class="brand"><b lang="ja">多読</b><span>Tadoku</span></div>
    <button class="ghost" id="openLibrary">Library</button>
    <button class="ghost" id="openSettings">Settings</button>
  </div>
  <p class="pool" id="pool"></p>
  <p class="pool" id="ready" aria-live="polite"></p>
  <button class="linkbtn" id="openPick" type="button">Choose words to practise</button>
  <p class="picked" id="picked" hidden></p>
</header>

<div class="wrap">
  <div class="notice status" id="status" hidden role="status"></div>
  <div class="notice error" id="error" hidden role="alert"></div>
  <main id="story"></main>
</div>

<div class="dock">
  <div class="wrap">
    <input id="topic" type="text" placeholder="Story idea (optional)" autocomplete="off" enterkeyhint="go">
    <button class="primary" id="write">Write story</button>
  </div>
</div>

<dialog id="settings">
  <form class="sheet" method="dialog" id="settingsForm">
    <h3>Settings</h3>
    <label>WaniKani API token
      <small>Create a read-only token at <a href="https://www.wanikani.com/settings/personal_access_tokens" target="_blank" rel="noopener">wanikani.com/settings/personal_access_tokens</a></small>
      <input name="wkToken" type="password" autocomplete="off">
    </label>
    <label>Gemini API key
      <small>Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a></small>
      <input name="geminiKey" type="password" autocomplete="off">
    </label>
    <label>Gemini model
      <small>Change this only if Google renames the model. Lite models aren’t allowed because their Japanese isn’t reliable enough.</small>
      <input name="model" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    </label>

    <div class="row">
      <label>Story length
        <select name="storyLength"><option value="short">Short</option><option value="medium">Medium</option><option value="long">Long</option></select>
      </label>
      <label>Grammar level
        <select name="grammar"><option value="auto">Match my level</option><option>N5</option><option>N4</option><option>N3</option><option>N2</option></select>
      </label>
    </div>
    <div class="row">
      <label>Words that need work
        <input name="nCritical" type="number" min="0" max="15" inputmode="numeric">
      </label>
      <label>Words to keep fresh
        <input name="nReinforce" type="number" min="0" max="15" inputmode="numeric">
      </label>
    </div>
    <div class="row">
      <label>Needs work below
        <small>Accuracy %</small>
        <input name="threshold" type="number" min="10" max="100" inputmode="numeric">
      </label>
      <label>Furigana
        <small>&nbsp;</small>
        <select name="furigana"><option value="always">Always shown</option><option value="tap">Tap to reveal</option></select>
      </label>
    </div>
    <label>Reading speed
      <select name="speech"><option value="0.7">Slow</option><option value="0.85">Relaxed</option><option value="1">Natural</option></select>
    </label>
    <div class="actions">
      <button class="primary" value="save">Save settings</button>
      <button class="ghost" type="button" id="refreshWK">Refresh WaniKani data</button>
      <button class="ghost danger" type="button" id="clearAll">Clear all data</button>
    </div>
    <p class="pool">Tadoku version 10</p>
  </form>
</dialog>

<dialog id="wordSheet"><div class="sheet" id="wordBody"></div></dialog>
<dialog id="pick"><div class="sheet">
  <h3>Choose words to practise</h3>
  <input id="pickSearch" type="search" placeholder="Search kanji, reading or meaning" autocomplete="off">
  <div class="chips" id="pickChips">
    <button type="button" data-f="crit" aria-pressed="true">Needs work</button>
    <button type="button" data-f="app" aria-pressed="false">Apprentice</button>
    <button type="button" data-f="guru" aria-pressed="false">Guru</button>
    <button type="button" data-f="sel" aria-pressed="false">Chosen</button>
  </div>
  <ul class="pl" id="pickList"></ul>
  <div class="pickfoot"><span class="n" id="pickCount">None chosen</span><button class="ghost" type="button" id="pickClear">Clear</button><button class="primary" type="button" id="pickGo" disabled>Write story</button></div>
</div></dialog>
<dialog id="library"><div class="sheet"><h3>Library</h3><ul class="lib" id="libList"></ul><div class="actions"><button class="primary" id="closeLib">Close</button></div></div></dialog>

<script>
(function(){
'use strict';
var WK = 'https://api.wanikani.com/v2/';
var PREFIX = 'tadoku:';
var STAGES = ['Lesson','Apprentice I','Apprentice II','Apprentice III','Apprentice IV','Guru I','Guru II','Master','Enlightened','Burned'];
var LENGTHS = {short:'5 to 7', medium:'8 to 12', long:'14 to 18'};
var HAN = /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/g;
var DEFAULTS = {wkToken:'', geminiKey:'', model:'gemini-flash-latest', threshold:75, nCritical:2, nReinforce:1, storyLength:'medium', grammar:'auto', furigana:'always', speech:'0.85', v:3};
function isLite(m){ return /lite/i.test(String(m || '')); }

var store = {
  get: function(k, d){ try{ var v = localStorage.getItem(PREFIX+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem(PREFIX+k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del: function(k){ try{ localStorage.removeItem(PREFIX+k); }catch(e){} }
};

var settings = Object.assign({}, DEFAULTS, store.get('settings', {}));
if (settings.v !== 3){ settings.nCritical = 2; settings.nReinforce = 1; settings.v = 3; }
if (isLite(settings.model)) settings.model = DEFAULTS.model;
delete settings.fallbackModel;
store.set('settings', settings);
var busy = false;
var current = null;

function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function status(msg){ var el = $('#status'); el.hidden = !msg; el.textContent = msg || ''; }
function showError(msg){ var el = $('#error'); el.hidden = !msg; el.textContent = msg || ''; }
function applyFurigana(){ document.body.classList.toggle('furi-tap', settings.furigana === 'tap'); }

/* ---------- WaniKani ---------- */
async function wkFetch(url, report){
  report = report || status;
  for (var attempt = 0; attempt < 4; attempt++){
    var r;
    try{ r = await fetch(url, {headers:{'Authorization':'Bearer ' + settings.wkToken, 'Wanikani-Revision':'20170710'}}); }
    catch(e){ throw new Error('Couldn\u2019t reach WaniKani. Check your connection and try again.'); }
    if (r.status === 401) throw new Error('WaniKani rejected your API token. Check it in Settings.');
    if (r.status === 429){ report('WaniKani is rate limiting, waiting a moment'); await sleep(6000); continue; }
    if (!r.ok) throw new Error('WaniKani returned an error (' + r.status + '). Try again shortly.');
    return r.json();
  }
  throw new Error('WaniKani is busy. Wait a minute and try again.');
}
async function wkGetAll(url, label, report){
  report = report || status;
  var out = [], next = url, page = 0;
  while (next){
    page++; report(label + (page > 1 ? ' (page ' + page + ')' : ''));
    var j = await wkFetch(next, report);
    out = out.concat(j.data || []);
    next = j.pages ? j.pages.next_url : null;
  }
  return out;
}
function trimSubject(s){
  var d = s.data;
  var m = (d.meanings || []).filter(function(x){ return x.accepted_answer; })
    .sort(function(a,b){ return b.primary - a.primary; }).slice(0,3).map(function(x){ return x.meaning; });
  var r = (d.readings || []).filter(function(x){ return x.accepted_answer !== false; })
    .sort(function(a,b){ return b.primary - a.primary; }).slice(0,2).map(function(x){ return x.reading; });
  return {t: s.object === 'kanji' ? 'k' : 'v', c: d.characters, m: m, r: r, l: d.level};
}
async function loadWK(force, report){
  report = report || status;
  var cached = store.get('wk', null);
  var subj = store.get('subjects', null);
  if (!force && cached && subj && Date.now() - cached.at < 30*60*1000) return {wk: cached, subjects: subj.items};
  report('Checking your WaniKani level');
  var user = await wkFetch(WK + 'user', report);
  var level = user.data.level;
  if (force || !subj || subj.level !== level || Date.now() - subj.at > 7*86400000){
    var levels = []; for (var i = 1; i <= level; i++) levels.push(i);
    var raw = await wkGetAll(WK + 'subjects?types=kanji,vocabulary&levels=' + levels.join(','), 'Downloading kanji and vocabulary', report);
    var items = {};
    raw.forEach(function(s){ if (!s.data.hidden_at && s.data.characters) items[s.id] = trimSubject(s); });
    subj = {level: level, at: Date.now(), items: items};
    store.set('subjects', subj);
  }
  var asg = await wkGetAll(WK + 'assignments?subject_types=kanji,vocabulary&started=true', 'Loading your progress', report);
  var srs = {}; asg.forEach(function(a){ srs[a.data.subject_id] = a.data.srs_stage; });
  var rs = await wkGetAll(WK + 'review_statistics?subject_types=kanji,vocabulary', 'Loading your accuracy', report);
  var stats = {}; rs.forEach(function(s){ var d = s.data; stats[d.subject_id] = {p: d.percentage_correct, n: d.meaning_correct + d.meaning_incorrect + d.reading_correct + d.reading_incorrect}; });
  var wk = {at: Date.now(), level: level, srs: srs, stats: stats};
  store.set('wk', wk);
  dict = null;
  report('');
  return {wk: wk, subjects: subj.items};
}
function buildPool(data){
  var critical = [], reinforce = [], known = new Set();
  Object.keys(data.wk.srs).forEach(function(id){
    var stage = data.wk.srs[id], s = data.subjects[id];
    if (!s) return;
    if (s.t === 'k' && stage >= 5) known.add(s.c);
    var st = data.wk.stats[id];
    var item = Object.assign({id: String(id), stage: stage, pct: st ? st.p : null}, s);
    if (stage >= 1 && stage < 9 && st && st.n >= 4 && st.p < settings.threshold) critical.push(item);
    else if (stage === 7 || stage === 8) reinforce.push(item);
  });
  critical.sort(function(a,b){ return a.pct - b.pct; });
  return {critical: critical, reinforce: reinforce, known: known, level: data.wk.level};
}
function sample(arr, n){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a.slice(0, n);
}
function showPool(pool){

/* ---------- Gemini ---------- */
function parseJSON(text){
  var t = text.replace(/```json|```/g, '').trim()
    .replace(/<t id="(\d+)">/g, '<t$1>');
  var a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < 0) throw new Error('The story came back in an unexpected format. Try again.');
  return JSON.parse(t.slice(a, b + 1));
}
async function callModel(model, prompt){
  model = String(model || '').trim().replace(/^models\//, '');
  var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(settings.geminiKey);
  var r;
  try{
    r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({contents:[{role:'user', parts:[{text: prompt}]}], generationConfig:{temperature: 0.7, responseMimeType:'application/json'}})});
  }catch(e){ throw new Error('Couldn\u2019t reach Gemini. Check your connection and try again.'); }
  var j = await r.json().catch(function(){ return {}; });
  return {ok: r.ok, status: r.status, json: j, model: model};
}
var FG_WAITS = [2000, 5000];
var BG_WAITS = [5000, 10000, 20000, 30000];
async function gemini(prompt, label, report, waits){
  report = report || status;
  waits = waits || FG_WAITS;
  var lastMsg = '';
  for (var attempt = 0; attempt <= waits.length; attempt++){
    var res = await callModel(settings.model || DEFAULTS.model, prompt);
    if (res.ok){
      var j = res.json;
      var parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
      var text = parts.map(function(p){ return p.text || ''; }).join('');
      var story = null;
      if (text){ try{ story = parseJSON(text); }catch(e){} }
      if (story && Array.isArray(story.sentences) && story.sentences.length){
        story.title = story.title || '';
        story.questions = Array.isArray(story.questions) ? story.questions : [];
        return story;
      }
      lastMsg = 'The reply came back garbled.';
    } else {
      lastMsg = (res.json.error && res.json.error.message) || ('HTTP ' + res.status);
      if (res.status === 404) throw new Error('Gemini: model \u201c' + res.model + '\u201d wasn\u2019t found. Check the model name in Settings.');
      if (res.status === 400 || res.status === 403) throw new Error('Gemini: ' + lastMsg);
    }
    if (attempt < waits.length){
      report(label + ': Gemini is busy, retrying in ' + Math.round(waits[attempt]/1000) + 's');
      await sleep(waits[attempt]);
      report(label);
    }
  }
  throw new Error('Gemini is busy right now, so no story was made rather than use a weaker model. Try again shortly; the app will also keep preparing stories in the background while it\u2019s open.');
}
function grammarFor(level){
  if (settings.grammar !== 'auto') return settings.grammar;
  return level <= 10 ? 'N5' : level <= 20 ? 'N4' : level <= 35 ? 'N3' : 'N2';
}
var MARKUP_RULES = [
  'Markup inside every Japanese string:',
  '- Give each kanji word furigana as ONE brace covering all its consecutive kanji: {予定|よてい}, {学校|がっこう}, {食|た}べました. Never split a compound into separate braces, and never leave a kanji outside braces. Okurigana stays outside.',
  '- Wrap each occurrence of a target word in <tID>...</t> with its id, e.g. <t2467>{食|た}べた</t>.',
  '- No spaces between words (normal Japanese, not wakachigaki). No other markup. Never use double quotes inside Japanese strings; use 「」 for speech.'
].join('\n');
var KANJI_RULE = 'If a word contains ANY kanji not in the allowed list, write the WHOLE word in hiragana (or katakana for loanwords). Never mix kanji and kana inside one word (write じゅしん, not 受しん). 々 is fine.';
var SCHEMA = '{"plan":"2-3 sentence English outline: who, where, what happens, how it ends","title":"Japanese title with markup","sentences":[{"jp":"sentence with markup","en":"natural English translation"}],"questions":[{"q":"comprehension question in simple Japanese with markup","a":"answer in English"}]}';
var NAMES = ['はると','ゆい','そうた','めい','りく','あおい','みさき','ゆうと','さくら','たくみ','ひなた','こはる','しょうた','まい','だいち','あかり','れん','ななみ','こうき','ちひろ','たろう','はな','けいこ','ひろし'];
var ROLES = ['a primary school child','a high school student','a university student','a new office worker','a shop owner','a retired grandfather','a grandmother','a nurse','a bus driver','a cook in a small restaurant','a farmer','a fisherman','a young mother','a train conductor','a librarian','a cat (the story is told about the cat)','a dog (the story is told about the dog)','a foreign tourist visiting Japan'];
var SETTINGS = ['a seaside town','a busy station','a snowy village','a small ramen shop','a library','a mountain hot spring','a school festival','a long train journey','a supermarket','a park in spring','a rainy afternoon at home','a summer festival','a bakery','a hospital waiting room','a quiet temple','a beach in summer','an apartment building','a rice field in autumn','a convenience store at night','a bicycle ride across town'];
var GENRES = ['a gentle mystery with a small clue','light comedy with a funny misunderstanding','a heart-warming story about kindness','a small adventure','an old-style folktale (昔話)','a slice-of-life day with a small surprise','a story about learning something new','a story about losing and finding something','a story about a promise','a seasonal story'];
function pickOne(a){ return a[Math.floor(Math.random() * a.length)]; }
function storySpec(topic){
  var recent = store.get('recentNames', []);
  var fresh = NAMES.filter(function(n){ return recent.indexOf(n) < 0; });
  var name = pickOne(fresh.length ? fresh : NAMES);
  store.set('recentNames', [name].concat(recent).slice(0, 8));
  var lines = [
    'Main character: ' + name + ', ' + pickOne(ROLES) + '. Write the name exactly as given, in kana. Do not use the name けん or ケン.',

function buildPrompt(targets, allowed, level, topic){
  var rows = targets.map(function(x){
    return x.id + ' | ' + x.c + ' | ' + x.r.join('/') + ' | ' + x.m.join(', ');
  }).join('\n');
  return [

    '',

    '2. Natural, grammatically correct Japanese a native speaker would write. Correct conjugations. No repeated words within a sentence, no filler.',
    '3. Using the target words. Use each one only where it fits naturally. Skipping a word is better than forcing it into a sentence that sounds odd. Never talk about words, kanji or language in the story.',
    '',

    'Length: ' + LENGTHS[settings.storyLength] + ' sentences.',
    storySpec(topic),

    '',

    rows || '(none)',
    '',
    'Allowed kanji (strict, use no others):',
    Array.from(allowed).join(''),
    KANJI_RULE,

function buildEditPrompt(story, allowed, bad){
  return [
    'You are a careful Japanese editor for graded readers. Edit this story JSON.',
    'Fix: grammar mistakes, wrong verb or adjective conjugations, unnatural or textbook-sounding phrasing, repeated words, and sentences that do not follow logically from the previous one. If a sentence only exists to squeeze in a word, rewrite or remove it, dropping its tag if needed.',
    bad.length ? 'These kanji are NOT allowed and must go: ' + bad.join(' ') : '',
    'Allowed kanji: ' + Array.from(allowed).join(''),
    KANJI_RULE,
    'Keep the same plot, title, level and roughly the same length. Keep the <tID> tags on target words that remain. Update English translations and questions to match.',
    MARKUP_RULES,
    '',

function vocabFor(k, data, taken, anyVocab){
  var best = null;
  Object.keys(data.wk.srs).forEach(function(id){
    var s = data.subjects[id], stage = data.wk.srs[id];
    if (!s || s.t !== 'v' || taken.has(String(id)) || s.c.indexOf(k.c) < 0 || stage < 1) return;
    if (!best || stage > best.stage) best = Object.assign({id: String(id), stage: stage, pct: data.wk.stats[id] ? data.wk.stats[id].p : null}, s);
  });
  if (!best && anyVocab){
    Object.keys(data.subjects).forEach(function(id){
      var s = data.subjects[id];
      if (s.t !== 'v' || taken.has(String(id)) || s.c.indexOf(k.c) < 0) return;
      if (!best || s.c.length < best.c.length) best = Object.assign({id: String(id), stage: data.wk.srs[id] || 0, pct: null}, s);
    });
  }
  return best;
}
function kanaFix(str, allowed){
  return String(str || '').replace(/\{([^|{}]+)\|([^{}]+)\}/g, function(all, base, reading){
    var ks = base.match(HAN) || [];
    for (var i = 0; i < ks.length; i++) if (!allowed.has(ks[i])) return reading;
    return all;
  });
}
function unspace(str){
  // Japanese doesn't put spaces between words; drop any the model adds (keeps spaces between Latin letters)
  return String(str || '').replace(/[ \u3000\t]+/g, function(sp, i, all){
    return /[A-Za-z0-9]/.test(all[i - 1] || '') && /[A-Za-z0-9]/.test(all[i + sp.length] || '') ? ' ' : '';
  });
}
function sanitize(story, allowed){
  story.title = unspace(kanaFix(story.title, allowed));
  story.sentences.forEach(function(x){ x.jp = unspace(kanaFix(x.jp, allowed)); });
  story.questions.forEach(function(x){ x.q = unspace(kanaFix(x.q, allowed)); });
  return story;
}
function plain(s){ return String(s || '').replace(/<\/?t[^>]*>/g, '').replace(/\{([^|{}]+)\|[^{}]*\}/g, '$1'); }
function findBad(story, allowed){
  var txt = [story.title].concat(story.sentences.map(function(s){ return s.jp; }), story.questions.map(function(q){ return q.q; })).map(plain).join('');
  var bad = new Set();
  (txt.match(HAN) || []).forEach(function(ch){ if (!allowed.has(ch)) bad.add(ch); });
  return Array.from(bad);
}

/* ---------- Story making ---------- */
async function makeStory(topic, report, waits, exclude, picks){
  var data = await loadWK(false, report);
  var pool = buildPool(data);
  if (report === status) showPool(pool);
  var chosen = [];
  if (picks && picks.length){
    picks.forEach(function(id){
      var s = data.subjects[id]; if (!s) return;
      var st = data.wk.stats[id];
      chosen.push(Object.assign({id: String(id), stage: data.wk.srs[id] || 0, pct: st ? st.p : null, bucket: 'pick'}, s));
    });
  }
  var critPool = pool.critical.filter(function(x){ return !exclude.has(x.id); });
  var crit = sample(critPool.slice(0, Math.max(settings.nCritical*3, 15)), settings.nCritical);
  var pickedIds = new Set(crit.map(function(x){ return x.id; }));
  var rein = sample(pool.reinforce.filter(function(x){ return !pickedIds.has(x.id) && !exclude.has(x.id); }), settings.nReinforce);
  crit.forEach(function(x){ x.bucket = 'crit'; });
  rein.forEach(function(x){ x.bucket = 'rein'; });
  if (chosen.length){ crit = []; rein = []; exclude = new Set(); }
  var taken = new Set(exclude);
  var list = [];
  chosen.concat(crit, rein).forEach(function(x){
    var item = x;
    if (x.t === 'k'){
      item = vocabFor(x, data, taken, x.bucket === 'pick');
      if (!item) return;
      item.bucket = x.bucket;
      item.via = {c: x.c, pct: x.pct, stage: x.stage};
    }
    if (taken.has(item.id)) return;
    taken.add(item.id); list.push(item);
  });
  var allowed = new Set(pool.known);
  list.forEach(function(x){ (x.c.match(HAN) || []).forEach(function(ch){ allowed.add(ch); }); });

  report('Writing your story');
  var story = sanitize(await gemini(buildPrompt(list, allowed, pool.level, topic), 'Writing your story', report, waits), allowed);

  report('Proofreading grammar and kanji');
  var proofread = false;
  try{
    var bad = findBad(story, allowed);
    var edited = sanitize(await gemini(buildEditPrompt(story, allowed, bad), 'Proofreading', report, waits), allowed);
    if (findBad(edited, allowed).length <= bad.length){ story = edited; proofread = true; }
  }catch(e){ /* keep the draft and say so */ }
  story.proofread = proofread;

  var targets = {};
  list.forEach(function(x){ targets[x.id] = x; });
  return {story: story, targets: targets, allowed: Array.from(allowed).join(''), at: Date.now()};
}

/* ---------- Background queue ---------- */
var QUEUE_SIZE = 2;
var filling = null, queueGen = 0, waiters = [];
function getQueue(){ var q = store.get('queue', []); return Array.isArray(q) ? q : []; }
function setQueue(q){ store.set('queue', q); updateReady(); }
function usedIds(){
  var ex = new Set();
  getQueue().forEach(function(q){ Object.keys(q.targets).forEach(function(id){ ex.add(id); }); });
  if (current) Object.keys(current.targets).forEach(function(id){ ex.add(id); });
  return ex;
}
function updateReady(){
  var n = getQueue().length;
  $('#ready').textContent = n ? (n === 1 ? '1 story ready' : n + ' stories ready') : (filling ? 'Preparing your next story in the background' : '');
  $('#write').textContent = (n && !$('#topic').value.trim() && !chosenIds.size) ? 'Next story' : 'Write story';
}
function fillQueue(){
  if (filling || !settings.wkToken || !settings.geminiKey) return;
  var gen = queueGen;
  filling = (async function(){
    try{
      while (getQueue().length < QUEUE_SIZE && gen === queueGen){
        updateReady();
        var made = await makeStory('', function(){}, BG_WAITS, usedIds());
        if (gen !== queueGen) break;
        var q = getQueue(); q.push(made); setQueue(q);
        waiters.splice(0).forEach(function(r){ r(true); });
      }
    }catch(e){ /* Gemini busy; try again later */ }
    finally{
      filling = null;
      waiters.splice(0).forEach(function(r){ r(false); });
      updateReady();
    }
  })();
}
function resetQueue(){ queueGen++; store.del('queue'); updateReady(); }
function showStory(saved){
  stopSpeaking();
  addToLibrary(saved);
  current = saved;
  store.set('last', current);
  render(current);
  window.scrollTo(0, 0);
}
function takeFromQueue(){
  var q = getQueue();
  if (!q.length) return false;
  var next = q.shift(); setQueue(q);
  showStory(next);
  return true;
}

/* ---------- Main flow ---------- */
function setBusy(on){ busy = on; $('#write').disabled = on; $('#story').classList.toggle('dim', on); }
async function newStory(){
  if (busy) return;
  if (!settings.wkToken || !settings.geminiKey){ openSettings(); return; }
  var topic = $('#topic').value.trim();
  var picks = Array.from(chosenIds);
  showError('');
  if (!topic && !picks.length){
    if (takeFromQueue()){ fillQueue(); return; }
    if (filling){
      setBusy(true); status('Your next story is almost ready');
      var got = await new Promise(function(r){ waiters.push(r); });
      status(''); setBusy(false);
      if (got && takeFromQueue()){ fillQueue(); return; }
    }
  }
  setBusy(true);
  try{
    var made = await makeStory(topic, status, FG_WAITS, usedIds(), picks);
    status('');
    showStory(made);
    $('#topic').value = '';
    if (picks.length){ chosenIds.clear(); updatePicked(); }
  }catch(e){
    status('');
    showError(e.message || String(e));
  }finally{
    setBusy(false);
    fillQueue();
  }
}

/* ---------- Rendering ---------- */
function markKanji(s, allowed){
  return s.replace(HAN, function(ch){ return allowed.has(ch) ? ch : '<span class="bad" title="Not learned yet">' + ch + '</span>'; });
}
function renderJP(str, ctx){
  var re = /<t(?: id=\\?")?(\d+)\\?"?>|<\/t>|\{([^|{}]+)\|([^{}]+)\}/g, html = '', last = 0, open = false, m;
  str = String(str || '');
  while ((m = re.exec(str))){
    html += markKanji(esc(str.slice(last, m.index)), ctx.allowed);
    if (m[1] !== undefined){
      if (open) html += '</span>';
      var it = ctx.targets[m[1]];
      if (it){ ctx.used.add(m[1]); html += '<span class="tg ' + it.bucket + '" data-id="' + m[1] + '" role="button" tabindex="0">'; open = true; }
      else open = false;
    } else if (m[0] === '</t>'){
      if (open){ html += '</span>'; open = false; }
    } else {
      html += '<ruby data-w="' + esc(m[2]) + '" data-r="' + esc(m[3]) + '">' + markKanji(esc(m[2]), ctx.allowed) + '<rt>' + esc(m[3]) + '</rt></ruby>';
    }
    last = re.lastIndex;
  }
  html += markKanji(esc(str.slice(last)), ctx.allowed);
  if (open) html += '</span>';
  return html;
}
function metaLine(x){
  if (x.via) return 'For the kanji ' + x.via.c + ': ' + (STAGES[x.via.stage] || '') + (x.via.pct != null ? ', ' + x.via.pct + '% correct' : '');

  st.sentences.forEach(function(s, i){

  if (!canSpeak()) return null;
  var vs = speechSynthesis.getVoices().filter(function(v){ return /^ja/i.test(v.lang); });
  jaVoice = vs.find(function(v){ return /google/i.test(v.name); }) || vs[0] || null;
  return jaVoice;
}
if (canSpeak()){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function spoken(jp){ return String(jp || '').replace(/<\/?t[^>]*>/g, '').replace(/\{([^|{}]+)\|([^{}]+)\}/g, '$2'); }
function clearSpeaking(){
  document.querySelectorAll('.sent.speaking').forEach(function(el){ el.classList.remove('speaking'); });
  document.querySelectorAll('.oto.on').forEach(function(el){ el.classList.remove('on'); });
  var b = $('#listenAll'); if (b) b.textContent = 'Listen to the story';
}
function stopSpeaking(){ speakRun++; if (canSpeak()) speechSynthesis.cancel(); clearSpeaking(); }
function speakIndexes(list){
  if (!current) return;
  stopSpeaking();
  if (!jaVoice && !pickVoice()){ showError('Your phone has no Japanese voice installed. On Android, add Japanese in Settings, then Text-to-speech output, then Google Speech Services.'); }
  var run = speakRun, sents = current.story.sentences, k = 0;
  function next(){
    if (run !== speakRun) return;
    clearSpeaking();
    if (k >= list.length) return;
    var i = list[k++];
    var el = document.getElementById('sent' + i); if (el) el.classList.add('speaking');
    var btn = document.querySelector('.oto[data-i="' + i + '"]'); if (btn) btn.classList.add('on');
    if (list.length > 1){ var b = $('#listenAll'); if (b) b.textContent = 'Stop'; }
    var u = new SpeechSynthesisUtterance(spoken(sents[i].jp));
    u.lang = 'ja-JP'; if (jaVoice) u.voice = jaVoice;
    u.rate = parseFloat(settings.speech) || 0.85;
    u.onend = next; u.onerror = function(){ if (run === speakRun) clearSpeaking(); };
    speechSynthesis.speak(u);
  }
  next();
}

/* ---------- Look up any word ---------- */
var dict = null;
function getDict(){
  if (dict) return dict;
  var subj = store.get('subjects', null), wk = store.get('wk', null);
  if (!subj) return null;
  var byChars = {};
  Object.keys(subj.items).forEach(function(id){ var c = subj.items[id].c; (byChars[c] = byChars[c] || []).push(id); });
  dict = {items: subj.items, byChars: byChars, srs: wk ? wk.srs : {}, stats: wk ? wk.stats : {}};
  return dict;
}
function entry(d, id){
  var s = d.items[id]; if (!s) return null;
  var st = d.stats[id];
  return Object.assign({id: id, stage: d.srs[id], pct: st ? st.p : null}, s);
}
function findVocab(d, base, reading, after){
  var best = null, bestScore = -1;
  Object.keys(d.items).forEach(function(id){
    var s = d.items[id];
    if (s.t !== 'v' || s.c.indexOf(base) !== 0) return;
    if (!s.r.some(function(r){ return r.indexOf(reading) === 0; })) return;
    var rest = s.c.slice(base.length);
    var score = 10 - Math.min(rest.length, 9);
    if (rest === '') score += 20;
    if (/^[\u3041-\u3096ー]*$/.test(rest)) score += 10;
    if (rest && after && rest[0] === after[0]) score += 15;
    if (rest && after && after.indexOf(rest) === 0) score += 25;
    if (score > bestScore){ bestScore = score; best = id; }
  });
  return best ? entry(d, best) : null;
}
function lookupWord(base, reading, after){
  var d = getDict();
  var v = d ? findVocab(d, base, reading, after) : null;
  var kanji = (base.match(HAN) || []).map(function(ch){
    var ids = d && d.byChars[ch] ? d.byChars[ch].filter(function(id){ return d.items[id].t === 'k'; }) : [];
    return ids.length ? entry(d, ids[0]) : {c: ch, m: [], stage: undefined};
  });
  var head = v ? v.c : base, read = v ? v.r.join('\u3001') : reading;
  var h = '<div class="ws-char" lang="ja">' + esc(head) + '</div>' +
    '<div class="ws-read" lang="ja">' + esc(read) + '</div>' +
    '<div class="ws-mean">' + (v ? esc(v.m.join(', ')) : '<span class="why">Not a WaniKani vocabulary word you\u2019ve reached yet.</span>') + '</div>';
  if (v) h += '<dl><dt>Stage</dt><dd>' + esc(v.stage != null ? STAGES[v.stage] : 'Not started') + '</dd>' + (v.pct != null ? '<dt>Accuracy</dt><dd>' + v.pct + '%</dd>' : '') + '</dl>';
  if (kanji.length){
    h += '<ul class="kl">' + kanji.map(function(k){
      return '<li><b lang="ja">' + esc(k.c) + '</b>' + esc(k.m && k.m.length ? k.m.slice(0,2).join(', ') : 'Not in your WaniKani levels yet') +
        '<span>' + esc(k.stage != null ? STAGES[k.stage] : (k.m && k.m.length ? 'Not started' : '')) + '</span></li>';
    }).join('') + '</ul>';
  }
  var link = v ? 'https://www.wanikani.com/vocabulary/' + encodeURIComponent(v.c) : 'https://jisho.org/search/' + encodeURIComponent(base);
  h += '<div class="actions"><button class="ghost" id="sayWord">Hear it</button><a class="ghost" href="' + link + '" target="_blank" rel="noopener">' + (v ? 'Open on WaniKani' : 'Look up on Jisho') + '</a><button class="primary" id="closeWord">Close</button></div>';
  $('#wordBody').innerHTML = h;
  $('#closeWord').onclick = function(){ $('#wordSheet').close(); };
  $('#sayWord').onclick = function(){
    if (!canSpeak()) return;
    stopSpeaking();
    var u = new SpeechSynthesisUtterance(v ? v.r[0] : reading); u.lang = 'ja-JP'; if (jaVoice) u.voice = jaVoice; u.rate = parseFloat(settings.speech) || 0.85;
    speechSynthesis.speak(u);
  };
  if (!canSpeak()) $('#sayWord').remove();
  $('#wordSheet').showModal();
}
function afterKana(r){
  var t = '', n = r.nextSibling;
  while (n && n.nodeType === 3){ t += n.textContent; n = n.nextSibling; }
  var m = t.match(/^[\u3041-\u3096ー]+/);
  return m ? m[0] : '';
}

/* ---------- Choose words ---------- */
var chosenIds = new Set(), pickData = null, pickFilter = 'crit', MAX_PICKS = 6;
function updatePicked(){
  var n = chosenIds.size, el = $('#picked');
  el.hidden = !n;
  el.textContent = n ? n + (n === 1 ? ' word' : ' words') + ' chosen for your next story' : '';
  $('#pickCount').textContent = n ? n + ' of ' + MAX_PICKS + ' chosen' : 'None chosen';
  $('#pickGo').disabled = !n;
  updateReady();
}
async function openPick(){
  if (!settings.wkToken){ openSettings(); return; }
  showError('');
  try{
    var data = await loadWK(false);
    status('');
    var pool = buildPool(data);
    var critSet = new Set(pool.critical.map(function(x){ return x.id; }));
    var items = [];
    Object.keys(data.wk.srs).forEach(function(id){
      var stage = data.wk.srs[id], s = data.subjects[id];
      if (!s || stage < 1 || stage > 6) return;
      var st = data.wk.stats[id];
      items.push(Object.assign({id: String(id), stage: stage, pct: st ? st.p : null, crit: critSet.has(String(id))}, s));
    });
    pool.critical.forEach(function(x){ if (x.stage > 6) items.push(Object.assign({crit: true}, x)); });
    items.sort(function(a, b){ return (a.pct == null ? 101 : a.pct) - (b.pct == null ? 101 : b.pct) || a.stage - b.stage; });
    pickData = items;
  }catch(e){ status(''); showError(e.message); return; }
  renderPick();
  $('#pick').showModal();
}
function renderPick(){
  if (!pickData) return;
  var q = $('#pickSearch').value.trim().toLowerCase();
  var rows = pickData.filter(function(x){
    if (q) return x.c.indexOf(q) >= 0 || x.r.some(function(r){ return r.indexOf(q) >= 0; }) || x.m.some(function(m){ return m.toLowerCase().indexOf(q) >= 0; });
    if (pickFilter === 'crit') return x.crit;
    if (pickFilter === 'app') return x.stage >= 1 && x.stage <= 4;
    if (pickFilter === 'guru') return x.stage === 5 || x.stage === 6;
    return chosenIds.has(x.id);
  }).slice(0, 200);
  var full = chosenIds.size >= MAX_PICKS;
  $('#pickList').innerHTML = rows.length ? rows.map(function(x){
    var on = chosenIds.has(x.id), off = full && !on;
    return '<li><label class="pk' + (off ? ' off' : '') + '"><input type="checkbox" value="' + x.id + '"' + (on ? ' checked' : '') + (off ? ' disabled' : '') + '>' +
      '<span class="c" lang="ja">' + esc(x.c) + '</span><span>' + esc(x.m[0] || '') + ' <span lang="ja">' + esc(x.r[0] || '') + '</span>' +
      '<span class="x">' + (x.t === 'k' ? 'Kanji' : 'Vocabulary') + ', ' + esc(STAGES[x.stage] || '') + (x.pct != null ? ', ' + x.pct + '% correct' : '') + '</span></span></label></li>';
  }).join('') : '<li class="why" style="padding:1rem 0">' + (q ? 'No in-progress items match that.' : pickFilter === 'sel' ? 'Nothing chosen yet.' : 'Nothing here right now.') + '</li>';
  updatePicked();
}
$('#openPick').onclick = openPick;
$('#pickSearch').addEventListener('input', renderPick);
$('#pickChips').addEventListener('click', function(e){
  var b = e.target.closest('[data-f]'); if (!b) return;
  pickFilter = b.getAttribute('data-f');
  $('#pickSearch').value = '';
  document.querySelectorAll('#pickChips button').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
  renderPick();
});
$('#pickList').addEventListener('change', function(e){
  var c = e.target; if (!c.matches('input[type=checkbox]')) return;
  if (c.checked) chosenIds.add(c.value); else chosenIds.delete(c.value);
  renderPick();
});
$('#pickClear').onclick = function(){ chosenIds.clear(); renderPick(); };
$('#pickGo').onclick = function(){ $('#pick').close(); newStory(); };

/* ---------- Library ---------- */
function addToLibrary(saved){
  if (!saved || !saved.story) return;
  var lib = store.get('library', []);
  if (!Array.isArray(lib)) lib = [];
  if (lib.some(function(x){ return x.at === saved.at; })) return;
  lib.unshift(saved);
  lib = lib.slice(0, 30);
  while (!store.set('library', lib) && lib.length > 1) lib = lib.slice(0, Math.floor(lib.length / 2));
}
function openLibrary(){
  var lib = store.get('library', []);
  if (!Array.isArray(lib) || !lib.length){
    $('#libList').innerHTML = '<li class="why">Stories you read will be kept here, up to the last 30.</li>';
  } else {
    $('#libList').innerHTML = lib.map(function(x, i){
      var d = new Date(x.at);
      var when = d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}) + ', ' + d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
      var cur = current && current.at === x.at;
      return '<li' + (cur ? ' class="cur"' : '') + '><button data-lib="' + i + '"><span class="lt" lang="ja">' + esc(plain(x.story.title) || 'Untitled') + '</span><span class="ld">' + esc(when) + (cur ? ', reading now' : '') + '</span></button></li>';
    }).join('');
  }
  $('#library').showModal();
}
$('#libList').addEventListener('click', function(e){
  var b = e.target.closest('[data-lib]'); if (!b) return;
  var lib = store.get('library', []);
  var x = lib[+b.getAttribute('data-lib')]; if (!x) return;
  stopSpeaking();
  current = x; store.set('last', current); render(current); window.scrollTo(0, 0);
  $('#library').close();
});
$('#openLibrary').onclick = openLibrary;
$('#closeLib').onclick = function(){ $('#library').close(); };

/* ---------- Settings ---------- */
function openSettings(){
  var f = $('#settingsForm');
  Object.keys(DEFAULTS).forEach(function(k){ if (f.elements[k]) f.elements[k].value = settings[k]; });
  $('#settings').showModal();
}
function clampInt(v, lo, hi, d){ v = parseInt(v, 10); return isNaN(v) ? d : Math.min(hi, Math.max(lo, v)); }
$('#settingsForm').addEventListener('submit', function(){
  var f = this.elements, oldToken = settings.wkToken;
  settings = {
    wkToken: f.wkToken.value.trim(), geminiKey: f.geminiKey.value.trim(),
    model: (isLite(f.model.value) ? '' : f.model.value.trim()) || DEFAULTS.model,
    v: 3,
    storyLength: f.storyLength.value, grammar: f.grammar.value, furigana: f.furigana.value,
    nCritical: clampInt(f.nCritical.value, 0, 10, 2), nReinforce: clampInt(f.nReinforce.value, 0, 10, 1),
    threshold: clampInt(f.threshold.value, 10, 100, 75),
    speech: f.speech.value
  };
  store.set('settings', settings);
  if (oldToken !== settings.wkToken){ store.del('wk'); dict = null; $('#pool').textContent = ''; }
  applyFurigana();
  if (!current) renderEmpty();
  resetQueue();
  quietPool().then(fillQueue);
});
$('#refreshWK').onclick = async function(){
  $('#settings').close();
  if (!settings.wkToken) return;
  showError('');
  try{ var d = await loadWK(true); showPool(buildPool(d)); }catch(e){ status(''); showError(e.message); }
};
$('#clearAll').onclick = function(){
  if (!confirm('Remove your keys, settings and saved story from this browser?')) return;
  Object.keys(localStorage).forEach(function(k){ if (k.indexOf(PREFIX) === 0) localStorage.removeItem(k); });
  location.reload();
};

/* ---------- Events ---------- */
$('#openSettings').onclick = openSettings;
$('#write').onclick = newStory;
$('#topic').addEventListener('keydown', function(e){ if (e.key === 'Enter') newStory(); });
$('#topic').addEventListener('input', updateReady);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) fillQueue(); });
$('#story').addEventListener('click', function(e){
  var y = e.target.closest('.yaku');
  if (y){
    var en = document.getElementById(y.getAttribute('aria-controls'));
    var open = y.getAttribute('aria-expanded') === 'true';
    y.setAttribute('aria-expanded', String(!open)); en.hidden = open; return;
  }
  var o = e.target.closest('.oto');
  if (o){
    if (o.classList.contains('on')) stopSpeaking(); else speakIndexes([+o.getAttribute('data-i')]);
    return;
  }
  if (e.target.closest('#listenAll')){
    if (document.querySelector('.sent.speaking')) stopSpeaking();
    else speakIndexes(current.story.sentences.map(function(_, i){ return i; }));
    return;
  }
  var t = e.target.closest('.tg[data-id], .word[data-id]');
  var r = e.target.closest('ruby');
  if (r && settings.furigana === 'tap' && !r.classList.contains('on')){ r.classList.add('on'); return; }
  if (t){ openWord(t.getAttribute('data-id')); return; }
  if (r && r.getAttribute('data-w')) lookupWord(r.getAttribute('data-w'), r.getAttribute('data-r') || '', afterKana(r));
});
$('#story').addEventListener('keydown', function(e){
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.tg[data-id]')){ e.preventDefault(); openWord(e.target.getAttribute('data-id')); }
});
['settings','wordSheet','library','pick'].forEach(function(id){
  var d = document.getElementById(id);
  d.addEventListener('click', function(e){ if (e.target === d) d.close(); });
});

async function quietPool(){
  if (!settings.wkToken) return;
  try{ var d = await loadWK(false); showPool(buildPool(d)); }
  catch(e){ status(''); }
}

/* ---------- Start ---------- */
applyFurigana();
current = store.get('last', null);
if (current && current.story){ addToLibrary(current); render(current); } else { current = null; renderEmpty(); }
updateReady();
quietPool().then(fillQueue);
})();
</script>
